spring:
  application:
    name: movies-rag
  config:
    # Reuse the same .env as the Python scripts (optional: env vars win if .env is missing)
    import: "optional:file:.env[.properties]"
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash-lite
        embedding:
          # Embeddings have their own connection; the chat api-key does not apply here
          api-key: ${GEMINI_API_KEY}
          text:
            # Must match the model and size the Python ingestion used, or vectors aren't comparable
            model: gemini-embedding-2
            dimensions: 768
